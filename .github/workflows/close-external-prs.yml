# GitHub offers no setting that stops people opening pull requests on a public
# repository — forking can only be disabled on org-owned *private* repos. So the
# policy in CONTRIBUTING.md is enforced here instead: anyone other than the owner
# gets a courteous close and a pointer to Discussions.
name: Close external pull requests

on:
  pull_request_target:
    types: [opened, reopened]

# Least privilege. This workflow only comments and closes; it never builds,
# tests, or checks out the pull request's code — which is what makes
# `pull_request_target` safe to use here.
permissions:
  pull-requests: write

jobs:
  close:
    # The owner's own pull requests are the normal workflow and pass through.
    if: github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.issue.number
            const author = context.payload.pull_request.user.login

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr,
              body: [
                `Thanks for this, @${author} — and sorry to close it unread.`,
                '',
                'This project does not take code contributions. That is a statement about',
                'one maintainer\'s review capacity, not about the work in your patch.',
                '',
                '**What is genuinely wanted:** bug reports, questions, and ideas in',
                '[Discussions](https://github.com/happyren/dsh-agent-messaging/discussions).',
                'A good report of what broke is worth more here than a patch, because it',
                'describes something that could not have been found alone.',
                '',
                'If you need different behaviour, the MIT licence lets you fork and ship it.',
                'You do not need permission, and you do not need to ask.',
              ].join('\n'),
            })

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr,
              state: 'closed',
            })
